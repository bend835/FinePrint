<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #eef1f5;
      color: #172033;
      font: 1rem system-ui, sans-serif;
    }
    main {
      width: min(100%, 340px);
      padding: 20px;
      background: white;
      border: 1px solid #dce2eb;
      border-radius: 16px;
    }
    h1 { margin: 0 0 16px; font-size: 1.25rem; }
    output {
      display: block;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #eef1f5;
      text-align: right;
      overflow-wrap: anywhere;
      font-size: 1.75rem;
      font-variant-numeric: tabular-nums;
    }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      background: #eef1f5;
      color: inherit;
      font: inherit;
      font-size: 1.125rem;
      cursor: pointer;
    }
    button:hover { filter: brightness(.93); }
    button:focus-visible { outline: 2px solid #2149ad; outline-offset: 2px; }
    .operator { background: #dce7ff; }
    .equals { background: #2149ad; color: white; }
    .wide { grid-column: span 2; }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <h1 id="title">Calculator</h1>
    <output id="display" aria-label="Calculator display">0</output>
    <div class="keys">
      <button class="wide" data-key="clear" aria-label="Clear">C</button>
      <button data-key="delete" aria-label="Delete last digit">⌫</button>
      <button class="operator" data-key="/" aria-label="Divide">÷</button>
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button class="operator" data-key="*" aria-label="Multiply">×</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button class="operator" data-key="-" aria-label="Subtract">−</button>
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button class="operator" data-key="+" aria-label="Add">+</button>
      <button class="wide" data-key="0">0</button>
      <button data-key="." aria-label="Decimal point">.</button>
      <button class="equals" data-key="=" aria-label="Equals">=</button>
    </div>
  </main>
  <script>
    const display = document.querySelector('#display');
    const operations = {
      '+': (left, right) => left + right,
      '-': (left, right) => left - right,
      '*': (left, right) => left * right,
      '/': (left, right) => left / right
    };
    let entry = '0';
    let subtotal = 0;
    let pending = null;
    let replaceEntry = false;

    function applyPending() {
      const result = operations[pending](subtotal, Number(entry));
      entry = Number.isFinite(result) ? String(Number(result.toPrecision(15))) : 'Error';
      pending = null;
      replaceEntry = true;
    }

    function press(key) {
      if (key === 'clear') {
        entry = '0';
        pending = null;
        replaceEntry = false;
      } else if (key === 'delete') {
        if (!replaceEntry) entry = entry.slice(0, -1) || '0';
      } else if (key === '.' || /^[0-9]$/.test(key)) {
        if (replaceEntry) entry = '0';
        replaceEntry = false;
        if (key === '.') {
          if (!entry.includes('.')) entry += '.';
        } else if (entry.length < 15) {
          entry = entry === '0' ? key : entry + key;
        }
      } else if (key === '=') {
        if (pending && !replaceEntry) applyPending();
      } else if (Object.hasOwn(operations, key)) {
        if (pending && !replaceEntry) applyPending();
        if (entry !== 'Error') {
          subtotal = Number(entry);
          pending = key;
          replaceEntry = true;
        }
      }
      display.textContent = entry;
    }

    document.querySelector('.keys').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (button) press(button.dataset.key);
    });

    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      const shortcuts = { Enter: '=', Escape: 'clear', Backspace: 'delete' };
      if (event.key === 'Enter' && event.target instanceof HTMLButtonElement) return;
      const key = shortcuts[event.key] ?? event.key;
      if (/^[0-9.+*/=-]$/.test(key) || key === 'clear' || key === 'delete') {
        event.preventDefault();
        press(key);
      }
    });
  </script>
</body>
</html>
