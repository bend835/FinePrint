<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f3">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f3;
      color: #20211f;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #fff 0, #f5f5f3 65%);
    }
    .calculator {
      width: min(100%, 360px);
      padding: 24px;
      border: 1px solid #e8e8e4;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 70px rgb(28 29 26 / 10%), 0 2px 8px rgb(28 29 26 / 4%);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: #777a73;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border-radius: 7px;
      background: #e9f3ec;
      color: #267448;
      font-size: 15px;
      letter-spacing: 0;
    }
    .display {
      min-height: 108px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 4px 20px;
      overflow: hidden;
    }
    .expression {
      width: 100%;
      min-height: 18px;
      overflow: hidden;
      color: #92958e;
      font-size: 14px;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result {
      max-width: 100%;
      overflow: hidden;
      font-size: clamp(38px, 12vw, 52px);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      letter-spacing: -.06em;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      min-width: 0;
      height: 62px;
      border: 0;
      border-radius: 15px;
      background: #f3f4f1;
      color: #30322e;
      cursor: pointer;
      font: inherit;
      font-size: 21px;
      font-weight: 500;
      transition: background .15s, transform .1s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: #e9ebe6; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #a6d4b3; outline-offset: 2px; }
    .utility { color: #657068; font-size: 17px; }
    .operator { background: #edf4ee; color: #267448; font-size: 23px; }
    .operator:hover { background: #deeddf; }
    .equals {
      background: #287b49;
      color: #fff;
      box-shadow: 0 5px 12px rgb(40 123 73 / 22%);
    }
    .equals:hover { background: #216a3e; }
    .zero { grid-column: span 2; text-align: left; padding-left: 25px; }
    @media (max-width: 380px) {
      .calculator { padding: 19px; }
      .keys { gap: 8px; }
      button { height: 58px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true">÷</span> Calculator</h1>
    <section class="display" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression"></div>
      <output class="result" id="result" aria-label="Display">0</output>
    </section>
    <div class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="All clear">AC</button>
      <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-op="÷" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-op="×" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-op="−" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-op="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>
  <script>
    (() => {
      const result = document.querySelector('#result');
      const expression = document.querySelector('#expression');
      let current = '0';
      let stored = null;
      let operator = null;
      let replaceCurrent = false;
      let justEvaluated = false;

      const pretty = value => {
        if (!Number.isFinite(value)) return 'Error';
        const rounded = Number.parseFloat(value.toPrecision(12));
        return String(rounded);
      };
      const render = () => { result.textContent = current; };
      const clear = () => {
        current = '0'; stored = null; operator = null;
        replaceCurrent = false; justEvaluated = false; expression.textContent = '';
        render();
      };
      const inputDigit = digit => {
        if (current === 'Error' || replaceCurrent || justEvaluated) {
          current = digit;
          replaceCurrent = false;
          justEvaluated = false;
          if (!operator) expression.textContent = '';
        } else if (current === '0') current = digit;
        else if (current.replace('-', '').length < 12) current += digit;
        render();
      };
      const calculate = (left, right, op) => {
        switch (op) {
          case '+': return left + right;
          case '−': return left - right;
          case '×': return left * right;
          case '÷': return right === 0 ? NaN : left / right;
          default: return right;
        }
      };
      const chooseOperator = next => {
        if (current === 'Error') return;
        const value = Number(current);
        if (operator && !replaceCurrent) {
          const answer = calculate(stored, value, operator);
          current = pretty(answer);
          render();
          if (current === 'Error') { clear(); current = 'Error'; render(); return; }
        }
        stored = Number(current);
        operator = next;
        replaceCurrent = true;
        justEvaluated = false;
        expression.textContent = `${pretty(stored)} ${operator}`;
      };
      const equals = () => {
        if (!operator || stored === null || current === 'Error') return;
        const left = stored, right = Number(current), op = operator;
        expression.textContent = `${pretty(left)} ${op} ${pretty(right)} =`;
        current = pretty(calculate(left, right, op));
        stored = null; operator = null; replaceCurrent = true; justEvaluated = true;
        render();
      };
      const act = action => {
        if (action === 'clear') clear();
        if (action === 'decimal' && current !== 'Error') {
          if (replaceCurrent || justEvaluated) { current = '0'; replaceCurrent = false; justEvaluated = false; }
          if (!current.includes('.')) current += '.';
          render();
        }
        if (action === 'sign' && current !== 'Error' && Number(current) !== 0) { current = current.startsWith('-') ? current.slice(1) : `-${current}`; render(); }
        if (action === 'percent' && current !== 'Error') { current = pretty(Number(current) / 100); render(); }
        if (action === 'equals') equals();
      };

      document.querySelector('.keys').addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.digit !== undefined) inputDigit(button.dataset.digit);
        else if (button.dataset.op) chooseOperator(button.dataset.op);
        else if (button.dataset.action) act(button.dataset.action);
      });

      document.addEventListener('keydown', event => {
        if (/^[0-9]$/.test(event.key)) inputDigit(event.key);
        else if (event.key === '.') act('decimal');
        else if (event.key === '+') chooseOperator('+');
        else if (event.key === '-') chooseOperator('−');
        else if (event.key === '*') chooseOperator('×');
        else if (event.key === '/') { event.preventDefault(); chooseOperator('÷'); }
        else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); equals(); }
        else if (event.key === 'Escape' || event.key === 'Delete') clear();
        else if (event.key === '%') act('percent');
        else if (event.key === 'Backspace' && current !== 'Error') {
          current = current.length > 1 ? current.slice(0, -1) : '0';
          if (current === '-') current = '0';
          render();
        }
      });
    })();
  </script>
</body>
</html>
